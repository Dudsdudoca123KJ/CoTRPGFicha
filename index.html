<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17130f">
<title>Champions of Terestalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./config.js"></script>
<style>
:root{--bg:#17130f;--panel:#211b15;--panel2:#2a2119;--paper:#e9d7b3;--muted:#b9a98d;--gold:#c69a55;--gold2:#e0bd7b;--line:#57432e;--red:#9d493d;--green:#6d8b64;--shadow:0 18px 50px #0007}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#45311d 0,transparent 55%),var(--bg);color:var(--paper);font-family:Inter,system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--gold2)}
.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#17130feF;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.brand{font-family:Cinzel,serif;font-weight:800;letter-spacing:.08em;color:var(--gold2);font-size:17px}.brand small{display:block;font:10px Inter;color:var(--muted);letter-spacing:.22em;margin-top:2px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1,h2,h3,.serif{font-family:Cinzel,Georgia,serif}h1{font-size:clamp(26px,5vw,42px);margin:8px 0 10px}h2{font-size:23px;margin:0 0 15px}h3{font-size:16px;margin:0 0 10px;color:var(--gold2)}
p{color:var(--muted);line-height:1.55}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--paper);padding:10px 14px;border-radius:9px;font-weight:650;transition:.15s}.btn:hover{border-color:var(--gold);transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#b88643,#8f612e);border-color:#d2a45c;color:#1a130b}.btn.ghost{background:transparent}.btn.danger{border-color:#81453d;color:#e6a69b}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:linear-gradient(145deg,#2a2119,#201912);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.card.soft{background:#211a14;box-shadow:none}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;margin:9px 0}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;background:#15110d;color:var(--paper);border:1px solid #5b4731;border-radius:8px;padding:11px 12px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}.field textarea{min-height:82px;resize:vertical}
.auth{max-width:470px;margin:7vh auto}.auth .card{padding:26px}.auth h1{font-size:30px}.auth-tabs{display:flex;gap:8px;margin:18px 0}.auth-tabs button{flex:1}
.stat{background:#17120e;border:1px solid #59442d;border-radius:10px;padding:12px}.stat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.stat .v{font:700 25px Cinzel;color:var(--gold2);margin-top:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:9px}.nav button.active{background:#4a3520;color:#f4dfb8;border-color:var(--gold)}
.pill{font-size:10px;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--line);border-radius:99px;padding:5px 8px;color:var(--gold2)}
.character-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.char-tile{padding:16px;border:1px solid var(--line);border-radius:12px;background:#1b1510;cursor:pointer}.char-tile:hover{border-color:var(--gold)}.char-tile strong{font-family:Cinzel;font-size:17px}.bar{height:7px;background:#463729;border-radius:9px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#9a6131,#dfb86d)}
.attribute-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.attr{background:#17120e;border:1px solid #58432e;border-radius:10px;padding:10px;text-align:center}.attr label{font-size:10px;color:var(--muted);letter-spacing:.12em}.attr input{width:100%;text-align:center;font:700 22px Cinzel;color:var(--gold2);background:transparent;border:0;padding:5px 0;min-width:0}
.section{margin:16px 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px}
.readout{display:flex;flex-wrap:wrap;gap:8px}.readout span{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}.readout b{color:var(--gold2);font-size:14px;margin-left:4px}
.inline-input{width:82px!important;padding:8px!important}.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #4a3928}.list-row:last-child{border:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:9px;background:#e5d1a9;color:#21180f;font-weight:700;box-shadow:var(--shadow);z-index:20}
.footer{text-align:center;color:#806d53;font-size:11px;padding:30px 0}
@media(max-width:760px){.topbar{padding:0 14px}.wrap{padding:18px 13px 42px}.grid.two,.grid.three{grid-template-columns:1fr}.attribute-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.attr{padding:7px 3px}.attr input{font-size:18px}.card{padding:14px}.hide-mobile{display:none}.stat .v{font-size:22px}}
.btn.danger{border-color:#9c5148;color:#e6a39a}.btn.danger:hover{background:#542b27}.gear-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.gear-item .small{margin:3px 0}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand">CHAMPIONS <small>OF TERESTALIA</small></div>
 <div class="row"><span id="modeBadge" class="pill">Modo demonstração</span><button id="logoutBtn" class="btn ghost hidden">Sair</button></div>
</header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast hidden"></div>
<footer class="footer">TERESTALIA • Um mundo moldado pela mana. Uma jornada escrita pelas escolhas.</footer>
<script type="module">
const cfg=window.TERESTALIA_CONFIG||{};
const online=!!(cfg.supabaseUrl&&cfg.supabaseAnonKey);
let sb=null;
if(online){
 try{
  const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
  sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
 }catch(err){console.warn("Supabase indisponível; o modo demonstração continuará disponível.",err)}
}
const $=s=>document.querySelector(s), app=$("#app");
let user=null, memberships=[], campaign=null, characters=[], monsters=[], currentChar=null, tab="overview", authMode="login", saving=false;
let demo=JSON.parse(localStorage.getItem("terestalia_demo")||"null")||{campaigns:[],characters:[],monsters:[]};
const attrNames=["FOR","DES","INT","SAB","VIG"], focusNames=["Físico","Precisão","Mágico","Saber"];
const chargeCaps={"Físico":9,"Precisão":9,"Mágico":12,"Saber":12};
const xpTable={2:150,3:350,4:550,5:750,6:950,7:1150,8:1350,9:1550,10:1750};
const xpForLevel=l=>l<=1?0:(xpTable[Math.min(10,Math.max(2,+l||1))]||1750);
function levelFromXP(xp){let n=1;for(const [level,required] of Object.entries(xpTable)){if((+xp||0)>=required)n=+level;else break}return n}
function highestFocusLevel(ch){return Math.max(1,...Object.values(ch.focus_levels||{}).map(v=>+v||1))}
function normalizeFocusProgress(ch){
 const levels={...(ch.focus_levels||{})};
 if(!Object.keys(levels).length)levels.Físico=1;
 const oldMax=Math.max(1,...Object.values(levels).map(v=>+v||1));
 const xp={...(ch.focus_xp||{})};
 for(const [focus,levelValue] of Object.entries(levels)){
  const lvl=Math.max(1,Math.min(10,+levelValue||1));
  if(xp[focus]===undefined)xp[focus]=Math.max(xpForLevel(lvl),lvl===oldMax?(+ch.xp||0):0);
  xp[focus]=Math.max(0,Math.min(1750,+xp[focus]||0));
  levels[focus]=levelFromXP(xp[focus]);
 }
 ch.focus_xp=xp;ch.focus_levels=levels;ch.level=highestFocusLevel(ch);
 const top=Object.entries(levels).filter(([,v])=>v===ch.level).map(([f])=>xp[f]||0);
 ch.xp=top.length?Math.max(...top):0;
 return ch;
}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>globalThis.crypto?.randomUUID?.()||"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});
function toast(t){let el=$("#toast");el.textContent=t;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),2400)}
function saveDemo(){localStorage.setItem("terestalia_demo",JSON.stringify(demo))}
function defaultChar(){return {name:"Novo personagem",level:1,xp:0,focus_levels:{"Físico":1},focus_xp:{"Físico":0},attributes:{FOR:2,DES:2,INT:2,SAB:2,VIG:2},hp_current:24,charges:{"Físico":0,"Precisão":0,"Mágico":0,"Saber":0},armor_defense:0,shield_defense:0,armor_type:"Nenhuma",shield_type:"Nenhum",backpack_bonus:0,custom_equipment:[],inventory:[],active_skills:[],passive_skills:[],traits:[],notes:""}}
function calc(ch){let a=ch.attributes||{},items=(ch.custom_equipment||[]).filter(x=>x.equipped!==false),sum=(key)=>items.reduce((n,x)=>n+(+(x[key]||0)),0),ab={};attrNames.forEach(n=>ab[n]=items.reduce((v,x)=>v+(+(x.attribute_bonuses?.[n]||0)),0));
 let forc=(+a.FOR||0)+ab.FOR,des=(+a.DES||0)+ab.DES,int=(+a.INT||0)+ab.INT,sab=(+a.SAB||0)+ab.SAB,vig=(+a.VIG||0)+ab.VIG;
 let armor=+(ch.armor_defense||0),shield=+(ch.shield_defense||0),strReq=ch.armor_type==="Pesada"?5:ch.armor_type==="Média"?3:0,shReq=(ch.shield_type==="Pesado"||ch.shield_type==="Grande")?5:ch.shield_type==="Médio"?3:0;
 let penalty=(strReq&&forc<strReq?(ch.armor_type==="Pesada"?2:1):0)+(shReq&&forc<shReq?((ch.shield_type==="Pesado"||ch.shield_type==="Grande")?2:1):0);
 return {hpMax:20+vig*2+sum("hp_bonus"),def:5+des+armor+shield+sum("def_bonus"),initiative:des,movement:Math.max(0,des+vig-penalty+sum("movement_bonus")),capacity:Math.floor((forc+vig)/2)+(+(ch.backpack_bonus||0))+sum("capacity_bonus"),penalty,limit:highestFocusLevel(ch)<=3?5:highestFocusLevel(ch)<=6?8:11,attributeBonuses:ab,effective:{FOR:forc,DES:des,INT:int,SAB:sab,VIG:vig}}}
function damage(ch,focus){let lvl=+(ch.focus_levels?.[focus]||0);if(!lvl)return "—";let dice=lvl===1?1:lvl<=3?2:lvl<=5?3:lvl<=7?4:lvl<=9?5:6;let a=ch.attributes||{},bonus=focus==="Físico"?(+a.FOR||0):focus==="Precisão"?(+a.DES||0):"FOR ou DES";return `${dice}${focus==="Físico"?"d8":focus==="Precisão"?"d6":"d4"} + ${bonus}`}
function focusLevelSum(ch){return focusNames.filter(k=>(+ch.focus_levels?.[k]||0)>0).map(k=>`${k} ${ch.focus_levels[k]}`).join(" • ")||"Nenhum Foco"}
function newMonster(){return {name:"Nova criatura",pv:20,def:10,movement:4,attributes:{FOR:2,DES:2,INT:0,SAB:1,VIG:2},xp:30,description:"",attacks:""}}
function renderAuth(){app.innerHTML=`<section class="auth"><div class="eyebrow">A aventura começa aqui</div><h1>Entre em Terestalia</h1><p>Crie sua conta para participar de campanhas ou abra a demonstração local para conhecer a ficha.</p><div class="card"><div class="auth-tabs"><button class="btn ${authMode==="login"?"primary":""}" data-auth="login">Entrar</button><button class="btn ${authMode==="signup"?"primary":""}" data-auth="signup">Criar conta</button></div><div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="password" type="password" placeholder="Mínimo de 6 caracteres"></div><button id="authSubmit" class="btn primary" style="width:100%">${authMode==="login"?"Entrar":"Criar conta"}</button><div class="section"></div><button id="demoBtn" class="btn" style="width:100%">Experimentar demonstração local</button><p class="small">A demonstração salva apenas neste navegador. Para campanhas multiplayer, configure o Supabase conforme o README.</p><p class="small" style="color:${online?"#9fbd8e":"#e0a08d"}">${online?"Configuração do Supabase detectada neste arquivo.":"Supabase não detectado: verifique o arquivo config.js."}</p></div></section>`}
async function loadOnline(){let {data:mem,error}=await sb.from("campaign_members").select("campaign_id,role,campaigns(id,name,invite_code,gm_id)").eq("user_id",user.id);if(error)throw error;memberships=mem||[];campaign=memberships[0]?.campaigns||null;if(campaign)await loadCampaign()}
async function loadCampaign(){if(!campaign)return;let [cr,mr]=await Promise.all([sb.from("characters").select("*").eq("campaign_id",campaign.id),sb.from("monsters").select("*").eq("campaign_id",campaign.id)]);if(cr.error)throw cr.error;if(mr.error)throw mr.error;characters=(cr.data||[]).map(normalizeFocusProgress);monsters=mr.data||[]}
function loadDemo(){memberships=demo.campaigns.map(c=>({campaign_id:c.id,role:c.role,campaigns:c}));campaign=memberships[0]?.campaigns||null;characters=campaign?demo.characters.filter(x=>x.campaign_id===campaign.id).map(normalizeFocusProgress):[];monsters=campaign?demo.monsters.filter(x=>x.campaign_id===campaign.id):[]}
function render(){if(!user&&!demoMode){renderAuth();return}$("#logoutBtn").classList.remove("hidden");$("#modeBadge").textContent=online&&user?"Conectado":"Modo demonstração";if(!campaign){renderHome();return}if(!currentChar&&characters.length)currentChar=characters[0];if(tab==="sheet"&&currentChar)renderSheet();else if(tab==="monsters")renderMonsters();else renderCampaign()}
let demoMode=false;
let combatMode=false;
let restSwapMode=false;
let restSwapCharacterId=null;
function renderHome(){app.innerHTML=`<div class="row between"><div><div class="eyebrow">Painel de campanha</div><h1>Suas jornadas</h1><p>Crie uma campanha como mestre ou entre usando um código de convite.</p></div></div><div class="grid two"><div class="card"><h2>Criar campanha</h2><div class="field"><label>Nome da campanha</label><input id="newCampaignName" placeholder="Ex.: As Cinzas de Teralic"></div><button class="btn primary" id="createCampaign">Criar campanha</button></div><div class="card"><h2>Entrar por convite</h2><div class="field"><label>Código do mestre</label><input id="inviteCode" placeholder="Ex.: A7K9Q2" maxlength="12"></div><button class="btn" id="joinCampaign">Entrar na campanha</button></div></div>${memberships.length?`<div class="section"><h2>Campanhas disponíveis</h2>${memberships.map(m=>`<div class="list-row"><div><b>${esc(m.campaigns.name)}</b><div class="small muted">${m.role==="gm"?"Mestre":"Jogador"}</div></div><div class="row"><button class="btn" data-open-campaign="${m.campaign_id}">Abrir</button>${m.role==="gm"?`<button class="btn danger" data-delete-campaign="${m.campaign_id}">Excluir</button>`:""}</div></div>`).join("")}</div>`:""}`}
function renderCampaign(){let role=memberships.find(m=>m.campaign_id===campaign.id)?.role||"player";app.innerHTML=`<div class="row between"><div><div class="eyebrow">${role==="gm"?"Área do mestre":"Área do jogador"}</div><h1>${esc(campaign.name)}</h1><div class="small muted">Convite: <b style="color:var(--gold2)">${esc(campaign.invite_code||"—")}</b></div></div><div class="row"><button class="btn" id="backHome">Minhas campanhas</button>${role==="gm"?'<span class="pill">Mestre</span>':'<span class="pill">Jogador</span>'}</div></div><div class="nav"><button class="active" data-tab="overview">Personagens</button><button data-tab="monsters">Monstros ${role==="gm"?"(privado)":""}</button></div><div class="card"><div class="cardhead"><h2>Fichas da campanha</h2><button id="newCharacter" class="btn primary">+ Novo personagem</button></div>${characters.length?`<div class="character-list">${characters.map(ch=>`<div class="char-tile" data-char="${ch.id}"><div class="row between"><strong>${esc(ch.name)}</strong><span class="pill">Nv. ${highestFocusLevel(ch)}</span></div><p class="small">${esc(focusLevelSum(ch))}</p><div class="row between small"><span>PV ${ch.hp_current??0}/${calc(ch).hpMax}</span><span>${esc(ch.owner_id===user?.id||demoMode?"Sua ficha":"Ficha de jogador")}</span></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,100*(ch.hp_current??0)/calc(ch).hpMax))}%"></span></div>${(ch.owner_id===user?.id||role==="gm"||demoMode)?`<button class="btn danger" data-delete-char="${ch.id}">Excluir ficha</button>`:""}</div>`).join("")}</div>`:'<p>Nenhum personagem criado ainda.</p>'}</div><p class="small">O mestre pode visualizar e administrar todas as fichas da campanha. Cada jogador pode editar a própria ficha.</p>`}

const skillMilestones=[1,3,5,7,9,10];
function skillMeta(ch){
 ch.active_skills=Array.isArray(ch.active_skills)?ch.active_skills:[];
 ch.passive_skills=Array.isArray(ch.passive_skills)?ch.passive_skills:[];
 let meta=ch.active_skills.find(x=>x&&x._meta==='skill_choices');
 if(!meta){meta={_meta:'skill_choices',active:{},passive:{}};ch.active_skills.push(meta)}
 meta.active=meta.active||{};meta.passive=meta.passive||{};
 // Preserve skills created in the older free-text editor as learned and equipped.
 for(const [kind,arr] of [['active',ch.active_skills],['passive',ch.passive_skills]]){
  arr.forEach((x,i)=>{if(!x||x._meta)return;let match=skillCatalog.find(z=>z.type===kind&&z.name===x.name&&(!x.focus||z.focus===x.focus));if(match){x.id=match.id;x.focus=match.focus;x.level=match.level;if(kind==='active')x.cost=match.cost;const key=`${match.focus}:${match.level}`;if(!meta[kind][key])meta[kind][key]=match.id}else if(!x.id)x.id=`legacy-${kind}-${i}-${x.name||'skill'}`;if(x.equipped===undefined)x.equipped=true});
 }
 return meta;
}
function skillEntries(ch,kind){const arr=kind==='active'?ch.active_skills:ch.passive_skills;return (Array.isArray(arr)?arr:[]).filter(x=>x&&!x._meta)}

 <div class="card"><p class="small muted">O segundo espaço de habilidade ativa é liberado quando o personagem alcança o nível 5. Máximo de 2 habilidades ativas e 2 passivas equipadas. A lista inclui apenas habilidades aprendidas; as opções ainda não escolhidas permanecem como escolhas pendentes.</p></div>`;
 $('#backSheet').onclick=()=>renderSheet();

 app.querySelectorAll('select[id^="learn_"]').forEach(select=>select.onchange=()=>{const item=skillCatalog.find(x=>x.id===select.value),id=select.id.replace('learn_','preview_'),target=$('#'+id);if(target)target.innerHTML=item?`<b>${esc(item.name)}</b> • ${item.type==='active'?`${item.cost} cargas`:'Passiva'}<br>${esc(item.description)}`:'Selecione uma opção para ler o efeito completo.'});
 app.querySelectorAll('[data-learn-kind]').forEach(btn=>btn.onclick=async()=>{
  const kind=btn.dataset.learnKind,milestone=+btn.dataset.learnLevel,key=`${focus}:${milestone}`,select=$(`#learn_${kind}_${milestone}`),id=select?.value;
  if(!id)return toast('Selecione uma opção primeiro.');

  item.equipped=box.checked;await saveAbilityState(ch,focus);

 $('#restLongBtn')?.addEventListener('click',async()=>{if(combatMode)return toast('Não é possível descansar durante o combate.');if(restSwapMode&&restSwapCharacterId===ch.id)return toast('Conclua primeiro o descanso atual.');syncSheetHp(ch);let d=calc(ch),before=Math.max(0,Math.min(d.hpMax,Number(ch.hp_current??d.hpMax)));ch.hp_current=d.hpMax;currentChar=ch;restSwapMode=true;restSwapCharacterId=ch.id;await persistFull(ch);toast(`Descanso longo: +${d.hpMax-before} PV. Vida totalmente recuperada.`)});

function renderSheet(){let ch=currentChar,a=ch.attributes||{},d=calc(ch),role=memberships.find(m=>m.campaign_id===campaign.id)?.role||"player",isGM=role==="gm";let skills=skillEntries(ch,"active").filter(x=>x.equipped!==false),passives=skillEntries(ch,"passive").filter(x=>x.equipped!==false),traits=ch.traits||[],inv=ch.inventory||[];app.innerHTML=`<div class="row between"><div><div class="eyebrow">Ficha de personagem</div><h1>${esc(ch.name)}</h1><p class="small">${esc(campaign.name)} • ${esc(focusLevelSum(ch))}</p></div><div class="row"><button id="backCampaign" class="btn">← Campanha</button><button id="saveChar" class="btn primary">Salvar</button></div></div><div class="nav"><button data-tab="sheet" class="active">Ficha</button><button data-sheet-tab="progress">Progressão</button><button data-sheet-tab="equipment">Equipamentos</button><button data-sheet-tab="abilities">Habilidades</button><button data-sheet-tab="traits">Características</button><button data-sheet-tab="notes">Anotações</button></div><div class="grid two"><div class="card"><div class="cardhead"><h2>Identidade</h2><span class="pill">Maior nível: ${highestFocusLevel(ch)}</span></div><div class="field"><label>Nome</label><input id="ch_name" value="${esc(ch.name)}"></div><p class="small muted">O nível geral é definido pelo maior nível alcançado entre seus Focos. A experiência é acompanhada separadamente em cada Foco.</p><div class="field"><label>Raça / origem (opcional)</label><input id="ch_origin" value="${esc(ch.origin||"")}" placeholder="Em desenvolvimento"></div><div class="field"><label>História / conceito</label><textarea id="ch_concept">${esc(ch.concept||"")}</textarea></div></div><div class="card"><h2>Valores derivados</h2><div class="grid three"><div class="stat"><div class="k">Pontos de vida</div><div class="v" id="derived_hp">${ch.hp_current??d.hpMax}<small style="font-size:13px">/${d.hpMax}</small></div></div><div class="stat"><div class="k">Defesa</div><div class="v" id="derived_def">${d.def // O botão Sair fica no cabeçalho, fora de #app.

$("#logoutBtn").addEventListener("click", async () => {
  const button = $("#logoutBtn");
  button.disabled = true;

  try {
    if (online && user?.id !== "demo") {
      const { error } = await sb.auth.signOut();
      if (error) throw error;
    }

    user = null;
    demoMode = false;
    campaign = null;
    memberships = [];
    characters = [];
    monsters = [];
    currentChar = null;
    tab = "overview";

    button.classList.add("hidden");
    $("#modeBadge").textContent = "Modo demonstração";
    renderAuth();
    toast("Você saiu da conta.");
  } catch (err) {
    console.error("Falha ao sair:", err);
    toast("Não foi possível sair: " + (err?.message || "erro desconhecido"));
  } finally {
    button.disabled = false;
  }
});

 if(b.dataset.sheetTab==="progress"){normalizeFocusProgress(ch);let maxLvl=highestFocusLevel(ch),earned=(maxLvl-1)*2;app.innerHTML=`<div class="row between"><h1>Progressão</h1><button class="btn" id="backSheet">← Ficha</button></div><div class="card"><h2>Experiência por Foco</h2><p>Cada Foco possui seu próprio XP e nível. O nível é calculado automaticamente pela experiência acumulada.</p>${focusNames.map(f=>{let active=Object.prototype.hasOwnProperty.call(ch.focus_levels||{},f);return `<div class="section"><div class="row between"><b>${f}</b><span class="pill">${active?`Nível ${ch.focus_levels[f]}`:"Não iniciado"}</span></div><div class="field"><label>XP acumulada ${active?"":"(deixe em branco para não iniciado)"}</label><input class="focus-xp" data-focus-xp="${f}" type="number" min="0" max="1750" placeholder="Não iniciado" value="${active?(ch.focus_xp?.[f]??0):""}"></div><div class="small muted" id="focus_next_${focusNames.indexOf(f)}">${active?(ch.focus_levels[f]>=10?"Nível máximo atingido":`Próximo nível: ${xpForLevel(ch.focus_levels[f]+1)} XP`):"Este Foco ainda não começou."}</div></div>`}).join("")}<div class="divider"></div><h2>Progressão compartilhada</h2><div class="readout"><span>Maior nível alcançado <b id="sharedMax">${maxLvl}</b></span><span>PA ganhos por nível <b id="sharedEarned">${earned}</b></span><span>PA iniciais <b>10</b></span><span>Total de PA disponível <b id="sharedTotal">${10+earned}</b></span><span>Limite de atributo <b id="sharedLimit">${maxLvl<=3?5:maxLvl<=6?8:11}</b></span></div><p>Os 2 PA são concedidos somente quando o personagem alcança, pela primeira vez, um novo maior nível entre todos os Focos. Subir outro Foco até um nível já alcançado não concede PA novamente. No nível 10, são 18 PA ganhos além dos 10 iniciais.</p><h3>XP necessária por nível (cada Foco)</h3>${Object.entries(xpTable).map(([l,x])=>`<div class="list-row"><span>Nível ${l}</span><b>${x} XP</b></div>`).join("")}<button class="btn primary" id="saveProgress">Salvar progressão</button></div>`;$("#backSheet").onclick=()=>renderSheet();const previewProgress=()=>{let levels={...(ch.focus_levels||{})},xp={...(ch.focus_xp||{})};focusNames.forEach(f=>{let el=$(`[data-focus-xp="${f}"]`);if(!el)return;if(el.value.trim()===""){delete levels[f];delete xp[f]}else{xp[f]=Math.max(0,Math.min(1750,+el.value||0));levels[f]=levelFromXP(xp[f])}});let top=Math.max(1,...Object.values(levels).map(Number));$("#sharedMax").textContent=top;$("#sharedEarned").textContent=(top-1)*2;$("#sharedTotal").textContent=10+(top-1)*2;$("#sharedLimit").textContent=top<=3?5:top<=6?8:11;focusNames.forEach((f,i)=>{let el=$(`[data-focus-xp="${f}"]`),out=$("#focus_next_"+i);if(!out)return;if(!el.value.trim())out.textContent="Este Foco ainda não começou.";else{let lvl=levelFromXP(+el.value);out.textContent=lvl>=10?"Nível máximo atingido":`Nível ${lvl} • Próximo nível: ${xpForLevel(lvl+1)} XP`}})};app.querySelectorAll("[data-focus-xp]").forEach(el=>el.addEventListener("input",previewProgress));$("#saveProgress").onclick=async()=>{ch.focus_xp={};ch.focus_levels={};focusNames.forEach(f=>{let el=$(`[data-focus-xp="${f}"]`);if(el&&el.value.trim()!==""){let xp=Math.max(0,Math.min(1750,+el.value||0));ch.focus_xp[f]=xp;ch.focus_levels[f]=levelFromXP(xp)}});normalizeFocusProgress(ch);let cap=calc(ch).limit;ch.attributes=ch.attributes||{};attrNames.forEach(n=>ch.attributes[n]=Math.max(0,Math.min(cap,+ch.attributes[n]||0)));await persistFull(ch)}}
 if(b.dataset.sheetTab==="equipment"){
  const gear=ch.custom_equipment||[], inv=ch.inventory||[];
  const armorValues={"Nenhuma":0,"Leve":1,"Média":2,"Pesada":3},shieldValues={"Nenhum":0,"Leve":1,"Médio":2,"Pesado":3};
  const activeFoci=focusNames.filter(f=>(+ch.focus_levels?.[f]||0)>0);

  const used=()=>inv.reduce((n,x)=>n+(x.equipped?0:(+(x.slots||1))*(+(x.quantity||1))),0);

   <div class="readout"><span>Bônus de DEF <b id="armorBonus">${armorValues[ch.armor_type]??0}</b></span><span>Requisito <b id="armorReq">${ch.armor_type==="Pesada"?"FOR 5":ch.armor_type==="Média"?"FOR 3":"Nenhum"}</b></span></div>

   <p class="small muted">Armaduras: +1/+2/+3. Escudos: +1/+2/+3. Requisitos de FOR: média 3, pesada 5. Se não cumprir, o deslocamento é reduzido conforme o manual.</p>
   <div class="field"><label>Mochila</label><select id="eq_bag_type"><option value="0">Sem mochila (+0)</option><option value="2">Pequena (+2 slots)</option><option value="4">Média (+4 slots)</option><option value="6">Grande (+6 slots)</option></select></div>
   <div class="readout"><span>DEF atual <b id="equipmentDef">${d.def}</b></span><span>Deslocamento <b id="equipmentMove">${d.movement}</b></span></div></div>
   <div class="card"><h2>Catálogo oficial de armas e equipamentos</h2><p class="small">Os 80 itens do apêndice. Armas não possuem dado de dano próprio: o dano vem do Foco. A propriedade física e os efeitos especiais acompanham o item.</p>
   <div class="field"><label>Escolher item do catálogo</label><select id="eq_catalog_item"><option value="">Selecione um item...</option>${catalogOptions}</select></div><div id="catalogDetails" class="small muted">Selecione um item para ver categoria, propriedade, alcance e efeito.</div>
   <div class="row"><button id="addCatalogItem" class="btn primary">Adicionar ao inventário</button></div></div></div>
   <div class="card section"><div class="section-title"><h2>Inventário</h2><span class="pill">${used()}/${d.capacity} slots utilizados</span></div>
   <p class="small muted">Itens equipados não ocupam slots. Itens guardados ocupam o espaço indicado pela categoria. Armaduras não ocupam slots; moedas também não.</p>
   ${inv.map((x,i)=>`<div class="gear-item"><div class="row between"><b>${esc(x.name)}</b><span class="pill">${x.equipped?'Equipado':`${(x.slots||1)*(x.quantity||1)} slot(s)`}</span></div><div class="small">${esc(x.category||x.type||'Item')} ${x.property?`• ${esc(x.property)}`:''} ${x.rarity?`• ${esc(x.rarity)}`:''} ${(['Leve','Média','Pesada'].includes(x.category)&&((x.category==='Média'&&(ch.attributes?.FOR||0)<3)||(x.category==='Pesada'&&(ch.attributes?.FOR||0)<5)))?`<br><b style="color:var(--gold2)">Requisito não atendido: ${x.category==='Média'?'FOR 3 (−1 deslocamento)':'FOR 5 (−2 deslocamento)'}</b>`:''}</div>${x.effect?`<p class="small">${esc(x.effect)}</p>`:''}<div class="row"><label class="small"><input type="checkbox" data-inv-equipped="${i}" ${x.equipped?'checked':''}> Equipado</label><label class="small">Qtd. <input type="number" min="1" max="99" style="width:64px" data-inv-qty="${i}" value="${x.quantity||1}"></label><button class="btn danger" data-remove-inv="${i}">Remover</button></div></div>`).join('')||'<p class="small muted">Nenhum item no inventário.</p>'}</div>
   <div class="card section"><h2>Equipamentos especiais personalizados</h2><p class="small">Para itens criados pelo mestre ou efeitos mágicos que não estejam no catálogo. Os bônus são aplicados automaticamente enquanto equipados.</p><div class="grid two"><div class="field"><label>Nome</label><input id="gear_name" placeholder="Ex.: Couraça do Guardião"></div><div class="field"><label>Tipo</label><select id="gear_type"><option>Armadura</option><option>Acessório</option><option>Arma</option><option>Outro</option></select></div></div><div class="grid three"><div class="field"><label>Bônus de DEF</label><input id="gear_def" type="number" value="0"></div><div class="field"><label>Bônus de PV</label><input id="gear_hp" type="number" value="0"></div><div class="field"><label>Bônus de deslocamento</label><input id="gear_move" type="number" value="0"></div><div class="field"><label>Bônus de capacidade</label><input id="gear_capacity" type="number" value="0"></div></div><p class="small">Bônus de atributos:</p><div class="attribute-grid">${attrNames.map(n=>`<div class="attr"><label>${n}</label><input type="number" id="gear_attr_${n}" value="0"></div>`).join('')}</div><div class="field"><label>Efeito especial</label><textarea id="gear_effect"></textarea></div><button id="addGear" class="btn">Adicionar personalizado</button>${gear.map((g,i)=>`<div class="gear-item"><div class="row between"><b>${esc(g.name)}</b><button class="btn danger" data-remove-gear="${i}">Remover</button></div><label><input type="checkbox" data-toggle-gear="${i}" ${g.equipped!==false?'checked':''}> Equipado</label><p class="small">DEF +${g.def_bonus||0} • PV +${g.hp_bonus||0} • Mov. ${g.movement_bonus||0}</p></div>`).join('')}</div>
   <button id="saveEquipment" class="btn primary">Salvar equipamentos</button>`;
   $('#eq_armor').value=canArmor(ch.armor_type||'Nenhuma')?(ch.armor_type||'Nenhuma'):'Nenhuma';
   $('#eq_shield').value=shieldValues[ch.shield_type]!==undefined?ch.shield_type:'Nenhum';
   $('#eq_bag_type').value=String(ch.backpack_bonus||0);
   const refreshStats=()=>{let p={...ch,armor_type:$('#eq_armor').value,armor_defense:armorValues[$('#eq_armor').value],shield_type:$('#eq_shield').value,shield_defense:shieldValues[$('#eq_shield').value],backpack_bonus:+$('#eq_bag_type').value};let z=calc(p);$('#armorBonus').textContent=armorValues[p.armor_type];$('#armorReq').textContent=p.armor_type==='Pesada'?'FOR 5':p.armor_type==='Média'?'FOR 3':'Nenhum';$('#shieldBonus').textContent=shieldValues[p.shield_type];$('#shieldUses').textContent=shieldUses[p.shield_type];$('#equipmentDef').textContent=z.def;$('#equipmentMove').textContent=z.movement};
   $('#eq_armor').onchange=refreshStats;$('#eq_shield').onchange=()=>{ch.shield_catalog_name='';refreshStats()};$('#eq_bag_type').onchange=refreshStats;
   $('#eq_catalog_item').onchange=()=>{let item=weaponCatalog.find(x=>x.id===+$('#eq_catalog_item').value);$('#catalogDetails').innerHTML=item?`<b>${esc(item.name)}</b> • ${esc(item.rarity)}<br>Categoria: ${esc(item.category)} • Propriedade: ${esc(item.property)} • Guardado: ${item.slots} slot(s)<br>Alcance: ${esc(item.reach)}${item.effect?`<br>Efeito: ${esc(item.effect)}`:''}`:'Selecione um item para ver categoria, propriedade, alcance e efeito.'};
   $('#addCatalogItem').onclick=()=>{let item=weaponCatalog.find(x=>x.id===+$('#eq_catalog_item').value);if(!item)return toast('Selecione um item do catálogo.');ch.inventory=ch.inventory||[];if(ch.inventory.some(x=>x.catalog_id===item.id))return toast('Esse item já está no inventário.');const isShield=item.category.toLowerCase().startsWith('escudo');const shieldType=isShield?(item.category.toLowerCase().includes('médio')?'Médio':'Pesado'):null;if(isShield){ch.inventory.forEach(x=>{if((x.category||'').toLowerCase().startsWith('escudo'))x.equipped=false});ch.shield_type=shieldType;ch.shield_defense=shieldValues[shieldType];ch.shield_catalog_name=item.name;}ch.inventory.push({catalog_id:item.id,name:item.name,rarity:item.rarity,category:item.category,property:item.property,slots:item.slots,reach:item.reach,effect:item.effect,quantity:1,equipped:isShield});renderEquipment()};
   app.querySelectorAll('[data-inv-equipped]').forEach(el=>el.onchange=()=>{let it=inv[+el.dataset.invEquipped];if(el.checked&&['Leve','Média','Pesada'].includes(it.category)){let count=inv.filter((x,i)=>i!==+el.dataset.invEquipped&&x.equipped&&['Leve','Média','Pesada'].includes(x.category)).length;if(count>=2){el.checked=false;return toast('Você pode manter até duas armas equipadas.')} }if((it.category||'').toLowerCase().startsWith('escudo')){if(el.checked){inv.forEach((x,i)=>{if(i!==+el.dataset.invEquipped&&(x.category||'').toLowerCase().startsWith('escudo'))x.equipped=false});let t=it.category.toLowerCase().includes('médio')?'Médio':'Pesado';ch.shield_type=t;ch.shield_defense=shieldValues[t];ch.shield_catalog_name=it.name}else{ch.shield_type='Nenhum';ch.shield_defense=0;ch.shield_catalog_name=''}}it.equipped=el.checked;renderEquipment()});
   app.querySelectorAll('[data-inv-qty]').forEach(el=>el.onchange=()=>{inv[+el.dataset.invQty].quantity=Math.max(1,Math.min(99,+el.value||1));renderEquipment()});
   app.querySelectorAll('[data-remove-inv]').forEach(el=>el.onclick=()=>{inv.splice(+el.dataset.removeInv,1);renderEquipment()});
   $('#backSheet').onclick=()=>renderSheet();

   app.querySelectorAll('[data-toggle-gear]').forEach(el=>el.onchange=()=>{gear[+el.dataset.toggleGear].equipped=el.checked;renderEquipment()});
   app.querySelectorAll('[data-remove-gear]').forEach(el=>el.onclick=()=>{gear.splice(+el.dataset.removeGear,1);renderEquipment()});
   $('#saveEquipment').onclick=async()=>{ch.armor_type=$('#eq_armor').value;ch.armor_defense=armorValues[ch.armor_type];ch.shield_type=$('#eq_shield').value;ch.shield_defense=shieldValues[ch.shield_type];if(ch.shield_type==='Nenhum')ch.shield_catalog_name='';ch.backpack_bonus=+$('#eq_bag_type').value;ch.inventory=inv;await persistFull(ch)};
  };

 }
 if(b.dataset.sheetTab==="abilities"){renderAbilities(ch);}

 if(b.dataset.sheetTab==="traits"){renderTraits(ch)}
 if(b.dataset.sheetTab==="notes"){app.innerHTML=`<div class="row between"><h1>Anotações</h1><button class="btn" id="backSheet">← Ficha</button></div><div class="card"><textarea id="notes_text" style="min-height:260px">${esc(ch.notes||"")}</textarea><button id="saveNotes" class="btn primary">Salvar anotações</button></div>`;$("#backSheet").onclick=()=>renderSheet();$("#saveNotes").onclick=async()=>{ch.notes=$("#notes_text").value;await persistFull(ch)}}
});
async function persistFull(ch){if(online&&user&&!demoMode){let {error}=await sb.from("characters").update(ch).eq("id",ch.id);if(error)return toast(error.message)}else{let i=demo.characters.findIndex(x=>x.id===ch.id);if(i>=0)demo.characters[i]=ch;saveDemo()}currentChar=ch;let i=characters.findIndex(x=>x.id===ch.id);if(i>=0)characters[i]=ch;toast("Salvo");renderSheet()}
if(online){sb.auth.getSession().then(async({data,error})=>{if(error)throw error;if(data.session){user=data.session.user;await loadOnline()}render()}).catch(e=>{console.error("Falha ao recuperar sessão:",e);toast("Não foi possível verificar a sessão: "+(e.message||"erro de conexão"));renderAuth()});sb.auth.onAuthStateChange(async(_ev,session)=>{user=session?.user||null;if(user){try{await loadOnline();render()}catch(e){console.error("Falha ao carregar campanhas:",e);toast("Login realizado, mas houve erro ao carregar campanhas: "+(e.message||"erro"));render()}}else if(!demoMode){memberships=[];campaign=null;renderAuth()}})}else renderAuth();
